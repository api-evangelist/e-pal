name: E-Pal
description: E-Pal is a gaming social platform with the tagline "Never Battle Alone" that connects gamers
  to find teammates, compete, and socialize around competitive and casual gaming experiences. Its mobile
  apps (iOS and Android) let users discover gaming companions ("ePals"), form squads, use voice chat,
  play minigames, and hang out in social spaces. Product surfaces include Games (finding great teammates
  for titles like League of Legends and Valorant), Chilling (social hangout spaces), and Custom personalized
  experiences, plus a tiered community of eStars, Legend ePals (professional-rank players), and E-Chat.
  E-Pal is a consumer application and does not publish a public developer API, developer portal, or machine-readable
  API artifacts at this time; this profile was surfaced as an a16z portfolio company and enriched as an
  identity-only lead.
